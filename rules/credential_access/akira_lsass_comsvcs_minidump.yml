title: LSASS Credential Dump via comsvcs.dll MiniDump (Akira)
id: 2c093d4d-d5fd-48bb-aa71-63e5e8d11147
status: experimental
description: |
    Detects the comsvcs.dll MiniDump LOLBIN technique used to dump LSASS process memory for
    credential theft, observed in Akira ransomware intrusions per CISA AA24-109A. This is a
    high-fidelity technique with virtually no benign use.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-109a
author: Spencer (AI-augmented threat-hunting pipeline; T1-verified)
date: 2026/07/31
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_comsvcs:
        CommandLine|contains|all:
            - 'comsvcs.dll'
            - 'MiniDump'
    selection_lsass:
        CommandLine|contains:
            - 'lsass'
            - '(Get-Process lsass).Id'
    condition: selection_comsvcs and selection_lsass
falsepositives:
    - Extremely rare. Legitimate crash-dumping does not invoke comsvcs.dll MiniDump against LSASS.
level: high
