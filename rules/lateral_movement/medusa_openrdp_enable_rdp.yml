title: Firewall Rule Added for RDP Port 3389 via netsh (Medusa openrdp.bat)
id: 56af9895-8914-41f1-b936-97fa31a3b4aa
status: experimental
description: |
    Detects a netsh advfirewall rule opening inbound TCP/3389, as done by Medusa's openrdp.bat
    per CISA AA25-071A. Higher confidence when seen alongside the fDenyTSConnections=0 change.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-071a
author: Spencer (AI-augmented threat-hunting pipeline; T1-verified)
date: 2026/07/31
tags:
    - attack.defense-evasion
    - attack.t1562.004
    - attack.lateral-movement
    - attack.t1021.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
            - 'firewall'
            - '3389'
            - 'allow'
    condition: selection
falsepositives:
    - Legitimate RDP enablement by IT. Correlate with fDenyTSConnections change and account context.
level: medium
