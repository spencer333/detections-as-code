title: RDP Enabled via fDenyTSConnections Registry Change (Medusa openrdp.bat)
id: c15efe1e-2987-4835-a40b-4ac25f981c32
status: experimental
description: |
    Detects enabling of Remote Desktop by setting fDenyTSConnections to 0 via reg.exe, as done by
    Medusa ransomware's openrdp.bat per CISA AA25-071A. Frequently paired with a netsh firewall
    rule opening TCP/3389 (see companion rule below).
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-071a
author: Spencer (AI-augmented threat-hunting pipeline; T1-verified)
date: 2026/07/31
tags:
    - attack.lateral-movement
    - attack.defense-evasion
    - attack.t1021.001
    - attack.t1562.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'fDenyTSConnections'
            - '/d 0'
    condition: selection
falsepositives:
    - An administrator may legitimately enable RDP; correlate with the actor's other activity
      (netsh 3389 rule, PsExec, new accounts) and whether the change was expected.
level: medium
